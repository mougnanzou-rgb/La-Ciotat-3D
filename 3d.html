<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La Ciotat 3D — essai</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.126/Build/Cesium/Widgets/widgets.css"><style>html,body,#scene{width:100%;height:100%;margin:0;background:#12313e;font-family:system-ui}#bar{position:absolute;z-index:10;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;background:#fffffff0;padding:12px;border-radius:12px;color:#16323d}h1{font-size:17px;margin:0 0 7px}button,a{font:inherit;font-size:14px;padding:8px;border-radius:8px;border:1px solid #bbb;background:#fff;color:#125c87;text-decoration:none}#status{font-size:12px;margin:8px 0 0}#token{width:95%;padding:7px;margin-top:6px}details{margin-top:7px}.cesium-viewer-bottom{display:none}</style></head><body><div id="scene"></div><div id="bar"><h1>La Ciotat · Vue 3D expérimentale</h1><button id="port">Vieux-Port</button> <button id="city">Ville</button> <a href="./">Carte 2D</a><details><summary>Ajouter les bâtiments 3D</summary><input id="token" placeholder="Jeton public Cesium ion"><button id="load">Afficher les bâtiments</button></details><p id="status">Chargement du moteur 3D…</p></div><script src="https://cdn.jsdelivr.net/npm/cesium@1.126/Build/Cesium/Cesium.js"></script><script>(async()=>{let s=document.querySelector('#status');try{if(!window.Cesium)throw Error('Moteur Cesium non chargé sur cet appareil');Cesium.Ion.defaultAccessToken='';const viewer=new Cesium.Viewer('scene',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),baseLayer:new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}))});const fly=(lon,lat,height)=>viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,height),orientation:{heading:Cesium.Math.toRadians(20),pitch:Cesium.Math.toRadians(-55),roll:0},duration:1.5});document.querySelector('#port').onclick=()=>fly(5.6077,43.1738,1300);document.querySelector('#city').onclick=()=>fly(5.609,43.181,6500);document.querySelector('#load').onclick=async()=>{try{const t=document.querySelector('#token').value.trim();if(!t)throw Error('Colle la valeur du jeton Cesium ion');if(!t.startsWith('eyJ'))throw Error('Tu as collé le nom du jeton, pas sa valeur. Copie le jeton depuis Cesium ion.');Cesium.Ion.defaultAccessToken=t;const tiles=await Cesium.createOsmBuildingsAsync();viewer.scene.primitives.add(tiles);s.textContent='Bâtiments OSM chargés.'}catch(e){s.textContent='Bâtiments : '+(e&&e.message?e.message:String(e||'Erreur inconnue. Vérifie les ressources autorisées pour ce jeton.'))}};fly(5.6077,43.1738,1300);s.textContent='Globe 3D chargé. Les bâtiments demandent un jeton Cesium ion.'}catch(e){s.textContent='Erreur : '+e.message}})();</script></body></html>
