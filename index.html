<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La Ciotat 3D — Vieux-Port</title><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Widgets/widgets.css"><style>
html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:#12303c;font-family:system-ui,sans-serif}#panel{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;background:#fffc;border-radius:14px;padding:12px;box-shadow:0 2px 15px #0003}h1{font-size:16px;margin:0 0 8px}button{padding:9px;border:1px solid #bbb;background:white;border-radius:9px;font:inherit;margin:2px}#status{font-size:12px;margin:8px 0 0;color:#333}#token{width:100%;box-sizing:border-box;padding:9px;margin-top:8px;border-radius:8px;border:1px solid #bbb}.cesium-viewer-bottom{bottom:8px!important}</style></head>
<body><div id="map"></div><section id="panel"><h1>La Ciotat 3D · Vieux-Port</h1><button id="port">Vieux-Port</button><button id="city">Toute la ville</button><button id="tarte">La Tarte Tropézienne</button><details><summary>Option : bâtiments 3D</summary><input id="token" placeholder="Jeton public Cesium ion" autocomplete="off"><button id="buildings">Charger les bâtiments</button></details><p id="status">Chargement de la carte…</p></section>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Cesium.js"></script>
<script>
(async function(){const status=document.getElementById('status');try{if(!window.Cesium)throw Error('Cesium indisponible : vérifiez votre connexion Internet.');const viewer=new Cesium.Viewer('map',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),baseLayer:new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}))});const fly=(lon,lat,height,pitch=-55)=>viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,height),orientation:{heading:0,pitch:Cesium.Math.toRadians(pitch),roll:0},duration:1.4});document.getElementById('port').onclick=()=>fly(5.6077,43.1738,1400);document.getElementById('city').onclick=()=>fly(5.609,43.183,7500);const marker=viewer.entities.add({name:'La Tarte Tropézienne — position approximative à vérifier',position:Cesium.Cartesian3.fromDegrees(5.608,43.1737),point:{pixelSize:12,color:Cesium.Color.PINK,outlineColor:Cesium.Color.WHITE,outlineWidth:2},label:{text:'La Tarte Tropézienne (indicatif)',font:'14px sans-serif',showBackground:true,pixelOffset:new Cesium.Cartesian2(0,-24)}});document.getElementById('tarte').onclick=()=>viewer.flyTo(marker,{duration:1.4,offset:new Cesium.HeadingPitchRange(0,-0.7,500)});document.getElementById('buildings').onclick=async()=>{try{const token=document.getElementById('token').value.trim();if(!token)throw Error('Ajoutez un jeton public Cesium ion.');Cesium.Ion.defaultAccessToken=token;const tiles=await Cesium.createOsmBuildingsAsync();viewer.scene.primitives.add(tiles);status.textContent='Bâtiments OSM chargés (couverture variable).'}catch(e){status.textContent='Erreur bâtiments : '+e.message}};fly(5.6077,43.1738,1400);status.textContent='Carte du Vieux-Port prête. Bâtiments 3D en option avec jeton Cesium ion.'}catch(e){status.textContent='Impossible de démarrer : '+e.message}}})();
</script></body></html>
