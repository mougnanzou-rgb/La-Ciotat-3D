<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La Ciotat 3D · Ambiance</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.126/Build/Cesium/Widgets/widgets.css"><style>html,body,#scene{height:100%;width:100%;margin:0;overflow:hidden;background:#173a45;font-family:system-ui}#panel{position:absolute;z-index:10;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;background:#fffffff0;border-radius:12px;padding:10px;box-shadow:0 2px 12px #0002}h1{font-size:16px;margin:0 0 6px}button,a{font:inherit;font-size:13px;padding:8px;border:1px solid #bbc9ce;border-radius:8px;background:white;color:#165a79;text-decoration:none;margin:2px}#status{font-size:12px;margin:6px 0 0;color:#394d56}input{box-sizing:border-box;width:100%;padding:8px;margin:6px 0;border:1px solid #aaa;border-radius:6px}details{margin-top:5px}summary{font-size:13px;cursor:pointer}.cesium-viewer-bottom{display:none}</style></head><body><div id="scene"></div><div id="panel"><h1>La Ciotat · Ambiance Vieux-Port</h1><button id="port">Vieux-Port</button><button id="city">Ville</button><button id="toggle">Masquer bâtiments</button><button id="style">Façades blanches</button><a href="./3d.html">Ancienne 3D</a><details><summary>Activer les bâtiments 3D</summary><input id="token" type="password" placeholder="Valeur du jeton public Cesium ion" autocomplete="off"><button id="load">Charger les bâtiments</button></details><p id="status">Démarrage…</p></div><script src="https://cdn.jsdelivr.net/npm/cesium@1.126/Build/Cesium/Cesium.js"></script><script>(async()=>{const status=document.querySelector('#status');const say=x=>status.textContent=x;try{if(!window.Cesium)throw Error('Cesium ne se charge pas');Cesium.Ion.defaultAccessToken='';const viewer=new Cesium.Viewer('scene',{animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),baseLayer:new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'})),msaaSamples:1,contextOptions:{webgl:{antialias:false,powerPreference:'low-power'}}});viewer.resolutionScale=Math.min(1,1.5/(window.devicePixelRatio||2));viewer.scene.globe.maximumScreenSpaceError=3;viewer.scene.fog.enabled=true;viewer.scene.fxaa=false;viewer.scene.postProcessStages.fxaa.enabled=false;viewer.scene.screenSpaceCameraController.inertiaSpin=0.6;viewer.scene.screenSpaceCameraController.inertiaTranslate=0.6;viewer.scene.screenSpaceCameraController.inertiaZoom=0.45;viewer.targetFrameRate=30;let tiles=null;let styled=true;const applyStyle=()=>{if(!tiles)return;tiles.style=styled?new Cesium.Cesium3DTileStyle({color:"color('#f4a5b7', 1.0)"}):new Cesium.Cesium3DTileStyle({color:"color('#ffffff', 1.0)"})};document.querySelector('#style').onclick=()=>{styled=!styled;applyStyle();document.querySelector('#style').textContent=styled?'Façades blanches':'Façades roses';say(styled?'Façades roses activées':'Façades blanches activées')};const fly=(lon,lat,height)=>viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,height),orientation:{heading:Cesium.Math.toRadians(20),pitch:Cesium.Math.toRadians(-58),roll:0},duration:1.3});document.querySelector('#port').onclick=()=>fly(5.6077,43.1738,1300);document.querySelector('#city').onclick=()=>fly(5.609,43.181,6500);const toggle=document.querySelector('#toggle');toggle.onclick=()=>{if(!tiles){say('Charge les bâtiments depuis le menu ci-dessus.');return}tiles.show=!tiles.show;toggle.textContent=tiles.show?'Masquer bâtiments':'Afficher bâtiments';say(tiles.show?'Bâtiments visibles':'Bâtiments masqués — navigation plus légère')};document.querySelector('#load').onclick=async()=>{try{const token=document.querySelector('#token').value.trim();if(!token.startsWith('eyJ'))throw Error('Colle la valeur du jeton, pas son nom');Cesium.Ion.defaultAccessToken=token;say('Chargement progressif des bâtiments…');if(tiles){viewer.scene.primitives.remove(tiles);tiles=null}tiles=await Cesium.createOsmBuildingsAsync();tiles.maximumScreenSpaceError=16;tiles.dynamicScreenSpaceError=true;tiles.dynamicScreenSpaceErrorDensity=0.00278;tiles.dynamicScreenSpaceErrorFactor=4;tiles.skipLevelOfDetail=true;tiles.baseScreenSpaceError=1024;tiles.skipScreenSpaceErrorFactor=16;tiles.skipLevels=1;tiles.cullRequestsWhileMoving=true;tiles.cullRequestsWhileMovingMultiplier=30;tiles.maximumMemoryUsage=128;viewer.scene.primitives.add(tiles);applyStyle();toggle.textContent='Masquer bâtiments';say('Bâtiments roses chargés · bouton Façades blanches pour comparer')}catch(e){say('Erreur : '+(e&&e.message?e.message:String(e)))}};fly(5.6077,43.1738,1300);say('Carte prête. Active les bâtiments pour tester la fluidité.')}catch(e){say('Erreur de démarrage : '+(e&&e.message?e.message:String(e)))}})();</script></body></html>
