<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La Ciotat 3D</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:system-ui,sans-serif}#map{background:#dbe8e9}#panel{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;background:#fffefa;border-radius:13px;padding:12px;box-shadow:0 3px 15px #0003}h1{font-size:17px;margin:0 0 8px}button{background:#fff;border:1px solid #aaa;border-radius:8px;padding:9px;margin:3px;font-size:14px;color:#1358a4}#status{font-size:12px;color:#444;margin:8px 2px 0}#fallback{display:none;position:absolute;inset:0;z-index:2;background:#e6ecec;padding:20px;top:210px}#map .leaflet-control-attribution{font-size:10px}</style></head><body><div id="map"></div><div id="panel"><h1>La Ciotat · Vieux-Port</h1><button id="port">Vieux-Port</button><button id="city">Toute la ville</button><button id="tarte">La Tarte Tropézienne</button><p id="status">Initialisation de la carte…</p></div><div id="fallback">La carte n'a pas pu charger. Vérifie ta connexion Internet et recharge cette page.</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(function(){var s=document.getElementById('status');try{if(!window.L)throw Error('Bibliothèque de carte inaccessible');var map=L.map('map',{zoomControl:false}).setView([43.1738,5.6077],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);var mark=L.marker([43.1737,5.608]).addTo(map).bindPopup('La Tarte Tropézienne — repère indicatif, emplacement à confirmer');document.getElementById('port').onclick=function(){map.flyTo([43.1738,5.6077],17)};document.getElementById('city').onclick=function(){map.flyTo([43.181,5.609],13)};document.getElementById('tarte').onclick=function(){map.flyTo([43.1737,5.608],18);mark.openPopup()};s.textContent='Carte interactive prête · Version de diagnostic 2D';setTimeout(function(){map.invalidateSize()},500)}catch(e){s.textContent='Erreur : '+e.message;document.getElementById('fallback').style.display='block'}})();</script></body></html>
